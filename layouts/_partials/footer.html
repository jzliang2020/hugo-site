{{- if not (.Param "hideFooter") }}
<footer class="footer">
    <span>
        {{- with site.Params.copyright -}}
            {{ . | safeHTML }}
        {{- else -}}
            &copy; {{ now.Year }} <a href="{{ "" | absURL }}">{{ site.Title }}</a>
        {{- end -}}
    </span>
</footer>
{{- end }}
