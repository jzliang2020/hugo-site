baseURL = "https://liangjinzhi.com/"
defaultContentLanguage = "zh-cn"
locale = "zh-cn"
title = "梁锦志 | 运维与开发笔记"
theme = "PaperMod"
publishDir = "docs"

# Generate JSON index for search.
[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "index"
  isPlainText = true

[params]
  mainSections = ["posts"]
  digestInHTML = false
  showCodeCopyButtons = true       # 开启代码块复制按钮

  # 页脚与版权控制（针对 PaperMod 主题修正）
  hidePoweredBy = true             # 设为 true 彻底隐藏 "Powered by Hugo & PaperMod"
  copyright = "© 2026 梁锦志 | 运维与开发笔记"   # 自定义页脚显示的版权信息

[params.sidebar]
  emoji = "👋"
  subtitle = "记录运维与开发的笔记"
  avatar = "/img/avatar.png"
  avatarLink = "/posts/about-author/"
  widgets = ["search", "archives", "categories", "tags", "recent_posts"]

[params.sidebar.search]
  enable = true

[params.colorScheme]
  toggle = false
  default = "light"

[params.comments]
  enabled = false

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  identifier = "about"
  name = "关于作者"
  url = "/posts/about-author/"
  weight = 20
# force deploy 2026
