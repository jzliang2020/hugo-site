baseURL = "https://liangjinzhi.com/"
defaultContentLanguage = "zh-cn"
locale = 'zh-cn'
title = '我的个人博客'
theme = 'stack'
publishDir = "docs"

# 强制要求生成 JSON 索引，这是搜索框显示的唯一前提
[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "index"
  isPlainText = true

[params]
  mainSections = ["posts"]

[params.sidebar]
  emoji = "👋"
  subtitle = "记录运维与开发的笔记"
  avatar = "/img/avatar.png"
  avatarLink = "/posts/about-author/"
  widgets = ["search", "archives", "categories", "tags", "recent_posts"]

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  identifier = "about"
  name = "关于作者"
  url = "/posts/about-author/"
  weight = 20

[params.sidebar.search]
  enable = true
